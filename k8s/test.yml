
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: test
  labels:
    app: portfolio
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      containers:
        - name: portfolio
          image: 112000/portfolio:IMAGE_TAG
          imagePullPolicy: IfNotPresent
